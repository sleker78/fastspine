[project]
name = "FastSpine"
version = "1.0.0"
description = "FastAPI framework with a service-repository architecture, dependency injection, Redis caching and SQLAlchemy, Celery and Alembic integration."
authors = [
    {name = "Aleksandar Pavlovic", email = "sleker@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.16.5,<2",
    "asyncpg>=0.30.0",
    "celery>=5.3.1,<6",
    "ecs-logging>=2.0.0",
    "fastapi>=0.100.0,<1",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.3.4",
    "psutil>=5.9.0",
    "python-dateutil>=2.9.0,<3",
    "redis>=5.0.7",
    "sqlalchemy>=2.0.36,<3",
    "starlette>=0.40.0,<0.47.0",
    "rich>=14.0.0",
    "pandas>=2.1.3",
    "polars>=0.20.13",
    "fastapi-mail>=1.5.0",
    "openpyxl>=3.1.5",
    "termcolor>=2.3.0",
    "greenlet>=3.3.2",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "deptry>=0.16.2",
    "matplotlib>=3.8.0",
    "mypy>=1.8.0",
    "pre-commit>=3.3.3",
    "psycopg2-binary>=2.9.10",
    "py-heat-magic>=0.0.2",
    "pylint>=2.17.4",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=6.0.0",
    "ruff>=0.5.1",
    "seaborn>=0.12.2",
    "tqdm>=4.66.6",
    "yappi>=1.6.10",
    "types-python-dateutil",
    "aiosqlite>=0.22.1",
    "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry]
exclude = ["docs", ".venv", "venv", "node_modules", "__pycache__", ".git", ".uv-cache"]

[tool.deptry.per_rule_ignores]
DEP002 = ["openpyxl", "aiomysql", "asyncpg", "greenlet", "typer"]
DEP003 = ["httpx"]
DEP004 = ["pytest_asyncio", "pytest"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
# disable_error_code = ["import", "attr-defined", "name-defined", "misc", "no-untyped-def", "no-untyped-call", "var-annotated", "arg-type", "assignment", "return-value", "call-overload", "union-attr", "operator", "index", "type-arg", "valid-type", "func-returns-value", "return", "abstract", "override", "annotation-unchecked", "dict-item", "call-arg", "list-item", "has-type","type-var"]
enable_error_code = ["unused-awaitable"]
